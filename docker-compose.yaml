networks:
  red-microservicios:
    driver: bridge

volumes:
  mysql_data:
  kafka-data:

services:

  # 1. Base de datos
  database:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: bankatm_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red-microservicios

  # 2. Servidor Eureka
  eureka-server:
    build: ./BankATM_EurekaServer
    container_name: bankatm-eurekaservercontainer
    restart: always
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - red-microservicios

  # 3. API Gateway
  api-gateway:
    build: ./BankATM_APIGateway
    container_name: bankatm-apigatewaycontainer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - red-microservicios

  # 4. Microservicio de Usuarios
  servicio-usuarios:
    build: ./BankATM_User
    container_name: bankatm-usercontainer
    restart: always
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - "SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/bankatm_db?allowPublicKeyRetrieval=true&useSSL=false"
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - eureka-server
      - database
    networks:
      - red-microservicios

  # 5. Microservicio de Pedidos
  servicio-pedidos:
    build: ./BankATM_Order
    container_name: bankatm-ordercontainer
    restart: always
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - "SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/bankatm_db?allowPublicKeyRetrieval=true&useSSL=false"
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - eureka-server
      - database
    networks:
      - red-microservicios

  #6. Apache Kafka
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9091:9091"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka_jaas.conf:/etc/kafka/kafka_jaas.conf:ro
    networks:
      - red-microservicios
    environment:
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"  #true
      KAFKA_SUPER_USERS: "User:admin;User:ANONYMOUS"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Kafka en modo KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN

      # Listener interno y externo

      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9091,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:9091'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT'

      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_jaas.conf"

      # Single quotes pass the exact raw string directly to the container environment

      #Using a Confluentic Image like ->  image:confluentinc/cp-kafka:latest
      #KAFKA_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-password" user_admin="admin-password" user_writer-app="writer-password" user_consumer-app="consumer-password";'

      # Comunicación del controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Configuración básica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  # Servicio de inicialización para ACLs
  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    networks:
      - red-microservicios
    depends_on:
      - kafka
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        echo "Esperando a que el broker de Kafka esté disponible..."
        sleep 10
      
        echo "1. Creando archivo de credenciales..."
        cat > /tmp/admin.properties <<EOF
        security.protocol=SASL_PLAINTEXT
        sasl.mechanism=PLAIN
        sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-password";
        EOF
      
        echo "2. Creando Topicos..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --command-config /tmp/admin.properties \
          --create \
          --if-not-exists \
          --topic ordersTopic \
          --partitions 1 \
          --replication-factor 1
      
        echo "2. Aplicando permisos de ESCRITURA para writer-app..."
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 \
          --command-config /tmp/admin.properties \
          --add \
          --allow-principal User:writer-app \
          --operation Write \
          --operation Describe \
          --topic ordersTopic
      
        echo "3. Aplicando permisos de LECTURA para consumer-app..."
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 \
          --command-config /tmp/admin.properties \
          --add \
          --allow-principal User:consumer-app \
          --operation Read \
          --operation Describe \
          --topic ordersTopic \
          --group order-group
      
        echo "¡Autorizaciones aplicadas correctamente!"